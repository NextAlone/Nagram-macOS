name: Mac App Store

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the build to App Store Connect (TestFlight)
        type: boolean
        default: true
      notes:
        description: Release notes posted with the TestFlight build, docs/nagram/releases/<app version>.md when empty
        type: string
        default: ""
  push:
    branches: [ "main" ]

concurrency:
  group: appstore-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    outputs:
      version: ${{ steps.package.outputs.version }}
      build: ${{ steps.package.outputs.build }}
      min_os: ${{ steps.package.outputs.min_os }}
      notes: ${{ steps.notes.outputs.notes }}
    env:
      APP_STORE: ${{ github.event_name == 'workflow_dispatch' }}
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      XCODE_VERSION: "27.2"
      APPSTORE_ID: "6781000861"
      TEAM_ID: 7P8CLHDH5G
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_STRIP: "false"
      ARCHIVE: ${{ github.workspace }}/build/Nagram.xcarchive

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check the release notes
        id: notes
        env:
          NOTES_INPUT: ${{ inputs.notes }}
          BOT_TOKEN: ${{ secrets.NAGRAM_CHANNEL_BOT_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \(.*\);$/\1/p' Telegram.xcodeproj/project.pbxproj | sort -u)"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Telegram.xcodeproj has no single MARKETING_VERSION: '$VERSION'."
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$UPLOAD" != "true" ] || [ -z "$BOT_TOKEN" ]; then
            exit 0
          fi
          NOTES="${NOTES_INPUT:-docs/nagram/releases/$VERSION.md}"
          if [ ! -f "$NOTES" ]; then
            echo "::error::$NOTES is missing, write the notes of this build before uploading it."
            exit 1
          fi
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        id: xcode
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          test -d "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          echo "build=$(xcodebuild -version | awk '/^Build version / {print $3}')" >> "$GITHUB_OUTPUT"
          df -h "$GITHUB_WORKSPACE"

      - name: Free disk space
        run: |
          set -euo pipefail
          KEEP="$(cd "$(xcode-select -p)/../.." && pwd -P)"
          for app in /Applications/Xcode*.app; do
            if [ "$(cd "$app" && pwd -P)" != "$KEEP" ] && [ ! -L "$app" ]; then
              sudo rm -rf "$app"
            fi
          done
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet "$HOME/.dotnet"
          xcrun simctl runtime delete all || echo "::warning::Simulator runtimes were not deleted"
          df -h "$GITHUB_WORKSPACE"

      - name: Install Metal toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun --find metal

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install nasm yasm meson ninja cmake autoconf automake libtool pkgconf
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Apply Xcode 27 adjustments
        run: bash scripts/xcode27.sh apply

      - name: Fingerprint native frameworks
        id: frameworks
        run: |
          set -euo pipefail
          echo "key=$( (git submodule status --recursive; cat scripts/framework-inputs.sh scripts/configure_frameworks.sh; find core-xprojects -name project.pbxproj -o -name build.sh | sort | xargs shasum) | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore native frameworks
        id: frameworks-cache
        uses: actions/cache/restore@v4
        with:
          path: core-xprojects/*/build
          key: frameworks-${{ steps.xcode.outputs.build }}-${{ steps.frameworks.outputs.key }}
          restore-keys: frameworks-${{ steps.xcode.outputs.build }}-

      - name: Build native frameworks
        run: bash scripts/configure_frameworks.sh

      - name: Save native frameworks
        if: steps.frameworks-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: core-xprojects/*/build
          key: frameworks-${{ steps.xcode.outputs.build }}-${{ steps.frameworks.outputs.key }}


      - name: Set up App Store Connect API key
        if: env.APP_STORE == 'true'
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          : "${ASC_KEY_ID:?missing}" "${ASC_ISSUER_ID:?missing}" "${ASC_KEY_P8_BASE64:?missing}"
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Choose the build number
        run: |
          set -euo pipefail
          PLIST_BUILD="$(plutil -extract CFBundleVersion raw Telegram-Mac/Info.plist)"
          if [ "$APP_STORE" != "true" ]; then
            echo "BUILD_NUMBER=$PLIST_BUILD" >> "$GITHUB_ENV"
            exit 0
          fi
          LATEST="$(python3 scripts/nagram/asc_latest_build.py)"
          BUILD_NUMBER=$(( LATEST + 1 > PLIST_BUILD ? LATEST + 1 : PLIST_BUILD ))
          echo "Info.plist: $PLIST_BUILD, App Store Connect: $LATEST, using $BUILD_NUMBER"
          for plist in Telegram-Mac/Info.plist TelegramShare/Info.plist; do
            sed -i '' "/<key>CFBundleVersion<\/key>/{n;s/<string>[0-9]*<\/string>/<string>$BUILD_NUMBER<\/string>/;}" "$plist"
            test "$(plutil -extract CFBundleVersion raw "$plist")" = "$BUILD_NUMBER"
          done
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Write API credentials
        env:
          NAGRAM_API_ID: ${{ secrets.NAGRAM_API_ID }}
          NAGRAM_API_HASH: ${{ secrets.NAGRAM_API_HASH }}
        run: |
          set -euo pipefail
          if [ -z "$NAGRAM_API_ID" ] || [ -z "$NAGRAM_API_HASH" ]; then
            if [ "$UPLOAD" = "true" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::error::Set the NAGRAM_API_ID and NAGRAM_API_HASH secrets before uploading or posting a build."
              exit 1
            fi
            echo "::warning::NAGRAM_API_ID or NAGRAM_API_HASH is missing; this build cannot log in and must not be distributed."
            exit 0
          fi
          printf 'NAGRAM_API_ID = %s\nNAGRAM_API_HASH = %s\n' "$NAGRAM_API_ID" "$NAGRAM_API_HASH" > Telegram-Mac/Nagram.local.xcconfig

      - name: Archive
        run: |
          set -euo pipefail
          mkdir -p build
          FLAVOR=()
          if [ "$APP_STORE" = "true" ]; then
            FLAVOR=(SOURCE=APP_STORE 'OTHER_SWIFT_FLAGS=$(inherited) -DAPP_STORE' 'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) APP_STORE')
          fi
          set +e
          xcodebuild archive \
            -workspace Telegram-Mac.xcworkspace \
            -scheme Release \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -archivePath "$ARCHIVE" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ${FLAVOR[@]+"${FLAVOR[@]}"} \
            CODE_SIGNING_ALLOWED=NO > build/archive.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            grep -E -A3 '(^|: )(fatal )?error: |^ld: [^w]|^Undefined symbols|following build commands failed' build/archive.log | head -200 || true
            tail -40 build/archive.log
            df -h "$GITHUB_WORKSPACE"
            exit "$STATUS"
          fi
          tail -3 build/archive.log
          df -h "$GITHUB_WORKSPACE"

      - name: Package for the channel
        id: package
        if: github.event_name == 'push' || env.UPLOAD == 'true'
        run: |
          set -euo pipefail
          NAME="Nagram-$APP_VERSION-$BUILD_NUMBER"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            NAME="$NAME-${GITHUB_SHA::7}"
          fi
          MIN_OS="$(scripts/nagram/ci-package.sh "$ARCHIVE/Products/Applications/Telegram.app" "$RUNNER_TEMP/channel" "$NAME")"
          ls -l "$RUNNER_TEMP/channel"
          {
            echo "version=$APP_VERSION"
            echo "build=$BUILD_NUMBER"
            echo "min_os=$MIN_OS"
          } >> "$GITHUB_OUTPUT"

      - name: Save the channel files
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Nagram-macos-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/channel/*
          if-no-files-found: error
          retention-days: 7

      - name: Sign the archive with its entitlements
        if: env.APP_STORE == 'true'
        run: |
          set -euo pipefail
          APP="$ARCHIVE/Products/Applications/Telegram.app"
          codesign -f -s - --entitlements TelegramShare/TelegramShare.entitlements "$APP/Contents/PlugIns/TelegramShare.appex"
          codesign -f -s - --entitlements Telegram-Mac/Telegram-Sandbox.entitlements "$APP"
          codesign --verify --deep --strict "$APP"
          plutil -p "$APP/Contents/Info.plist" | grep -E '"CFBundle(ShortVersionString|Version)"'

      - name: Export and upload
        if: env.APP_STORE == 'true'
        run: |
          set -euo pipefail
          if [ "$UPLOAD" = "true" ]; then DESTINATION="upload"; else DESTINATION="export"; fi
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>$DESTINATION</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload the package
        if: env.APP_STORE == 'true' && env.UPLOAD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Nagram-${{ env.BUILD_NUMBER }}-appstore
          path: build/export/*.pkg

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build/archive.log
            /var/folders/**/*.xcdistributionlogs
          if-no-files-found: ignore

  channel:
    name: Channel
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      BOT_TOKEN: ${{ secrets.NAGRAM_CHANNEL_BOT_TOKEN }}
      ASSETS_CHAT_ID: ${{ vars.NAGRAM_CHANNEL_ASSETS_CHAT_ID }}
      OFFICIAL_CHAT_ID: ${{ vars.NAGRAM_CHANNEL_CHAT_ID }}
      TESTFLIGHT_URL: ${{ vars.NAGRAM_TESTFLIGHT_URL }}
      VERSION: ${{ needs.build.outputs.version }}
      BUILD: ${{ needs.build.outputs.build }}
      NOTES: ${{ needs.build.outputs.notes }}

    steps:
      - name: Check the configuration
        id: configuration
        run: |
          set -euo pipefail
          if [ -z "$BOT_TOKEN" ] || [ -z "$ASSETS_CHAT_ID$OFFICIAL_CHAT_ID" ]; then
            echo "::notice::NAGRAM_CHANNEL_BOT_TOKEN or both channels are not set, nothing is posted."
            exit 0
          fi
          CHAT_ID="${ASSETS_CHAT_ID:-$OFFICIAL_CHAT_ID}"
          COPY_TO=""
          if [ -n "$ASSETS_CHAT_ID" ] && [ -n "$OFFICIAL_CHAT_ID" ] && [ "$OFFICIAL_CHAT_ID" != "$ASSETS_CHAT_ID" ]; then
            COPY_TO="$OFFICIAL_CHAT_ID"
          fi
          {
            echo "chat=$CHAT_ID"
            echo "copy=$COPY_TO"
          } >> "$GITHUB_OUTPUT"

      - name: Clone
        if: steps.configuration.outputs.chat != ''
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: docs/nagram/releases

      - name: Download the channel files
        if: steps.configuration.outputs.chat != ''
        uses: actions/download-artifact@v4
        with:
          name: Nagram-macos-${{ env.BUILD }}
          path: ${{ runner.temp }}/channel

      - name: Describe the post
        id: post
        if: steps.configuration.outputs.chat != ''
        run: |
          set -euo pipefail
          ls -l "$RUNNER_TEMP/channel"
          test -f "$NOTES"
          NOTES_EN="${NOTES%.md}.en.md"
          if [ ! -f "$NOTES_EN" ]; then
            NOTES_EN=""
          fi
          {
            echo "notes_en=$NOTES_EN"
            echo "buttons<<BUTTONS"
            RELEASES="GitHub Releases=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
            if [ -n "$TESTFLIGHT_URL" ]; then
              echo "*TestFlight=$TESTFLIGHT_URL | $RELEASES"
            else
              echo "*$RELEASES"
            fi
            echo "问题反馈=https://t.me/OrIssuesBot"
            echo "BUTTONS"
          } >> "$GITHUB_OUTPUT"

      - name: Post to the channels
        if: steps.configuration.outputs.chat != ''
        uses: NextAlone/NagramActionRelated/channel-publish@5de594cfb14d39bd21f4bb513ac6fe355aec1b46
        with:
          bot-token: ${{ secrets.NAGRAM_CHANNEL_BOT_TOKEN }}
          api-id: ${{ secrets.NAGRAM_API_ID }}
          api-hash: ${{ secrets.NAGRAM_API_HASH }}
          chat-id: ${{ steps.configuration.outputs.chat }}
          copy-to: ${{ steps.configuration.outputs.copy }}
          directory: ${{ runner.temp }}/channel
          title: Nagram macOS
          version: ${{ env.VERSION }}
          build: ${{ env.BUILD }}
          hashtags: macos testflight
          notes-file: ${{ env.NOTES }}
          notes-en-file: ${{ steps.post.outputs.notes_en }}
          fold-sections: |
            安装
            已知限制
          files-title: 下载
          files: |
            *.dmg | 磁盘映像 · ad-hoc 签名 · macOS ${{ needs.build.outputs.min_os }} 及以上
            *.zip | zip 压缩包
          buttons: ${{ steps.post.outputs.buttons }}

  channel-test:
    name: Channel (test build)
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      BOT_TOKEN: ${{ secrets.NAGRAM_CHANNEL_BOT_TOKEN }}
      CHAT_ID: ${{ vars.NAGRAM_CHANNEL_ASSETS_CHAT_ID }}
      VERSION: ${{ needs.build.outputs.version }}
      BUILD: ${{ needs.build.outputs.build }}

    steps:
      - name: Check the configuration
        id: configuration
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::notice::NAGRAM_CHANNEL_BOT_TOKEN or NAGRAM_CHANNEL_ASSETS_CHAT_ID is not set, nothing is posted to the channel."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download the channel files
        if: steps.configuration.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Nagram-macos-${{ env.BUILD }}
          path: ${{ runner.temp }}/channel

      - name: Describe the post
        if: steps.configuration.outputs.ready == 'true'
        env:
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail
          ls -l "$RUNNER_TEMP/channel"
          printf '%s\n' "$COMMITS" > "$RUNNER_TEMP/channel-commits.json"

      - name: Post to the channel
        if: steps.configuration.outputs.ready == 'true'
        uses: NextAlone/NagramActionRelated/channel-publish@5de594cfb14d39bd21f4bb513ac6fe355aec1b46
        with:
          bot-token: ${{ secrets.NAGRAM_CHANNEL_BOT_TOKEN }}
          api-id: ${{ secrets.NAGRAM_API_ID }}
          api-hash: ${{ secrets.NAGRAM_API_HASH }}
          chat-id: ${{ env.CHAT_ID }}
          directory: ${{ runner.temp }}/channel
          kind: test
          title: Nagram macOS
          version: ${{ env.VERSION }}
          build: ${{ env.BUILD }}
          hashtags: macos test
          commits-file: ${{ runner.temp }}/channel-commits.json
          files: |
            *.dmg | 磁盘映像 · ad-hoc 签名 · macOS ${{ needs.build.outputs.min_os }} 及以上
            *.zip | zip 压缩包
          buttons: Commit=${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
